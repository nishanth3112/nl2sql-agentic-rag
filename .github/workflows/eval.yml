name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Pure logic: no API keys, no network, no BIRD databases. Runs on every push
  # and is expected to be green -- a failure here is a real defect, never a
  # provider outage or an unset secret.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python comes from .python-version, the same 3.11 the images use.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Everything except the live-provider regression suite. Named by exclusion
      # so a new test file is covered by default rather than silently skipped.
      - name: Run unit tests
        run: uv run --frozen pytest tests/ --ignore=tests/test_regression.py -v

  # End-to-end accuracy against live providers. Manual only: it spends real API
  # budget on every run, and a provider being down would otherwise redden the
  # badge for a reason that has nothing to do with the code. Run it from the
  # Actions tab ("Run workflow") after a change to prompts, agents or routing.
  #
  # To make this run automatically instead, drop the `if:` below -- the tests
  # themselves skip cleanly when the provider keys aren't set, so it won't fail
  # on a fork or on a repo without secrets configured.
  regression:
    name: Regression (live providers)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Python comes from .python-version, the same 3.11 the images use.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run regression tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCHMARK_DATA_PATH: ${{ vars.BENCHMARK_DATA_PATH || './data/bird-mini-dev' }}
        run: uv run --frozen pytest tests/test_regression.py -v -rs
