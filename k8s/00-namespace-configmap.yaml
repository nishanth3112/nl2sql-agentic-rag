apiVersion: v1
kind: Namespace
metadata:
  name: nl2sql-agentic-rag
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nl2sql-config
  namespace: nl2sql-agentic-rag
data:
  BENCHMARK_DATA_PATH: "/app/data/bird-mini-dev"
  CHROMA_PERSIST_DIR: "/app/chroma_db"
  REDIS_URL: "redis://redis:6379/0"
  MAX_RETRIES: "3"
  TRACING_ENABLED: "false"
  TRACE_EXPORT_PATH: "/app/logs/spans.jsonl"
  PLANNER_PROVIDER: "openai"
  PLANNER_MODEL: "gpt-5-mini"
  GENERATOR_PROVIDER: "openai"
  GENERATOR_MODEL: "gpt-5-mini"
  CLASSIFIER_PROVIDER: "groq"
  CLASSIFIER_MODEL: "llama-3.1-8b-instant"
